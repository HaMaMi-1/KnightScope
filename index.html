<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KnightScope</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand">♞ KnightScope</div><div>Classical chess position analysis</div></header><main><aside class="panel"><h2>Position controls</h2><label>Editor mode</label><div class="stack"><label><input type="radio" name="mode" value="move" checked> Move piece</label><label><input type="radio" name="mode" value="add"> Add piece</label><label><input type="radio" name="mode" value="remove"> Remove piece</label></div><label>Active colour</label><div class="stack row"><label><input type="radio" name="color" value="w" checked> White</label><label><input type="radio" name="color" value="b"> Black</label></div><label for="piece">Piece to add</label><select id="piece"><option value="q">Queen</option><option value="r">Rook</option><option value="b">Bishop</option><option value="n">Knight</option><option value="p">Pawn</option><option value="k">King</option></select><button id="reset">Reset starting position</button><button class="secondary" id="clear">Clear board</button><h2>Castling availability</h2><label><input id="wk" type="checkbox" checked> White kingside</label><label><input id="wq" type="checkbox" checked> White queenside</label><label><input id="bk" type="checkbox" checked> Black kingside</label><label><input id="bq" type="checkbox" checked> Black queenside</label></aside><section class="board-wrap"><div class="board-head"><h1>Interactive board</h1><button class="secondary" id="flip">Flip board</button></div><div id="board" aria-label="Chess board"></div><p class="hint">Click a piece then a square to move it. Add and Remove modes let you arrange any position.</p></section><aside class="panel analysis"><h2>AI analysis</h2><label for="depth">Search depth <span id="depthValue">2</span></label><input id="depth" type="range" min="1" max="3" value="2"><p id="turn"></p><label>FEN</label><textarea id="fen" rows="4"></textarea><div class="actions"><button class="secondary" id="loadFen">Load FEN</button><button id="analyse">Run Alpha-Beta analysis</button></div><div id="result" class="result">Arrange a position, then analyse it.</div></aside></main><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script><script src="app.js"></script></body></html>
